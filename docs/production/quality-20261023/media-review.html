<script>
'use strict';
const D=JSON.parse(document.getElementById('catalog').textContent);
const $=id=>document.getElementById(id), all=[...D.audio,...D.artwork], ids=new Set(all.map(x=>x.id));
const states=new Set(['pending','accepted','changes']);
const storageKey=`media-review:${D.project}:${D.runtimeCommit}:${D.catalogSha256}`;
let notes=Object.create(null), current=null, shown=[];
function validateImport(value){
 if(!value||value.schema!==1||value.project!==D.project||value.runtimeCommit!==D.runtimeCommit||value.catalogSha256!==D.catalogSha256)throw Error('版本或素材摘要不一致，未导入。');
 if(!value.notes||typeof value.notes!=='object'||Array.isArray(value.notes))throw Error('审阅记录格式无效。');
 const result=Object.create(null);
 for(const [id,n] of Object.entries(value.notes)){
  if(!ids.has(id)||!n||!states.has(n.status)||typeof n.note!=='string'||n.note.length>10000)throw Error('存在未知素材或无效备注，未导入。');
  result[id]={status:n.status,note:n.note};
 }
 return result;
}
function payload(){return {schema:1,project:D.project,runtimeCommit:D.runtimeCommit,catalogSha256:D.catalogSha256,notes};}
function message(text){$('message').textContent=text;}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(payload()));message('审阅记录已保存在本机；可随时导出。');}catch{message('浏览器记录不可用，当前记录仍在此页内，请导出 JSON 保存。');}}
try{const raw=localStorage.getItem(storageKey);if(raw)notes=validateImport(JSON.parse(raw));}catch{message('未载入本机记录；可从 JSON 重新导入。');}
function decision(item){return notes[item.id]?.status||'pending';}
function rawUrl(item){return `https://raw.githubusercontent.com/AureliusWu/${D.project}/${D.runtimeCommit}/`+item.path.split('/').map(encodeURIComponent).join('/');}
function mediaUrl(item){return $('source').value==='online'?rawUrl(item):D.localPrefix+item.path.split('/').map(encodeURIComponent).join('/');}
function stop(){const a=$('audio');a.pause();a.removeAttribute('src');a.load();$('art').removeAttribute('src');}
function show(item){
 stop(); current=item;
 $('detail').hidden=!item;
 if(!item)return;
 $('itemTitle').textContent=item.speaker||item.path;
 $('location').textContent=[item.id,item.sceneId,item.nodeId].filter(Boolean).join(' · ');
 $('text').textContent=item.text||'';
 $('tags').replaceChildren(...item.flags.map(f=>{const n=document.createElement('span');n.className='tag';n.textContent=D.flagLabels[f]||f;return n;}));
 const audio=Object.hasOwn(item,'text');$('audio').hidden=!audio;$('art').hidden=audio;
 if(audio)$('audio').src=mediaUrl(item);else{$('art').src=mediaUrl(item);$('art').alt=item.path;}
 const s=item.signal;
 $('metrics').textContent=s?`时长 ${s.durationSeconds}s · 首静音 ${s.leadingSilenceSeconds??'—'}s · 尾静音 ${s.trailingSilenceSeconds??'—'}s · 采样峰值 ${s.samplePeakDbfs??'—'}dBFS · 信号 RMS ${s.rmsDbfs??'—'}dBFS`:`${item.width??'—'} × ${item.height??'—'} · ${item.mode||'—'}`;
 $('asr').textContent=item.existingAsr?`录制时 ASR：${item.existingAsr.transcript||'—'}${item.existingAsr.exactTonedHomophones?'（已有逐音节同音复核）':''}；本轮未重新识别。`:'';
 $('raw').href=rawUrl(item);$('decision').value=decision(item);$('notes').value=notes[item.id]?.note||'';
 for(const button of $('list').children)button.setAttribute('aria-current',String(button.dataset.id===item.id));
}
function render(){
 const q=$('search').value.trim().toLowerCase(),wanted=$('status').value;
 shown=D[$('kind').value].filter(x=>(!$('priority').checked||x.flags.length)&&(wanted==='all'||decision(x)===wanted)&&(!q||[x.id,x.text,x.speaker,x.path,x.sceneId,x.nodeId].join(' ').toLowerCase().includes(q)));
 $('count').textContent=`${shown.length} / ${D[$('kind').value].length} 项；已审 ${all.filter(x=>decision(x)!=='pending').length} 项`;
 $('list').replaceChildren(...shown.map(item=>{
  const b=document.createElement('button');b.className='row';b.dataset.id=item.id;
  const title=document.createElement('span');title.textContent=(item.speaker?item.speaker+'：':'')+(item.text||item.path);
  const sub=document.createElement('small');sub.textContent=({pending:'待审',accepted:'通过',changes:'需修改'})[decision(item)]+' · '+item.id+(item.flags.length?' · 优先审阅':'');
  b.append(title,sub);b.addEventListener('click',()=>show(item));return b;
 }));
 show(shown.find(x=>x.id===current?.id)||shown[0]||null);
}
function save(){if(!current)return;notes[current.id]={status:$('decision').value,note:$('notes').value};persist();}
for(const id of ['kind','status','priority'])$(id).addEventListener('change',render);
$('search').addEventListener('input',render);
$('source').addEventListener('change',()=>show(current));
$('decision').addEventListener('change',()=>{save();render();});$('notes').addEventListener('input',save);
$('previous').addEventListener('click',()=>{if(shown.length)show(shown[Math.max(0,shown.indexOf(current)-1)]);});
$('next').addEventListener('click',()=>{if(shown.length)show(shown[Math.min(shown.length-1,shown.indexOf(current)+1)]);});
$('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`${D.project}-v${D.version}-media-review.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
$('import').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async event=>{try{const f=event.target.files[0];if(!f)return;if(f.size>2000000)throw Error('记录文件过大，未导入。');const imported=validateImport(JSON.parse(await f.text()));notes=Object.assign(Object.create(null),notes,imported);persist();render();}catch(e){message(e.message);}finally{event.target.value='';}});
$('audio').addEventListener('error',()=>message('无法读取音频：完整仓库内使用本地模式，或联网后选择固定发行提交。'));
$('art').addEventListener('error',()=>message('无法读取图片：完整仓库内使用本地模式，或联网后选择固定发行提交。'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)$('audio').pause();});
$('heading').textContent=`${D.project} v${D.version} · 素材审阅`;
$('identity').textContent=`${D.audio.length} 条对白 · ${D.artwork.length} 张画面 · 发行提交 ${D.runtimeCommit}`;
render();
</script>
