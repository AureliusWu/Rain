name: Publish verified Windows candidate

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: VERSION value to publish, for example 0.7.0
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Revalidate and publish exact selected commit
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      SDL_AUDIODRIVER: dummy
      RENPY_RENDERER: angle2
      RELEASE_EXPECTED_VERSION: ${{ inputs.expected_version }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify requested version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne $env:RELEASE_EXPECTED_VERSION) {
            throw "Requested version $env:RELEASE_EXPECTED_VERSION does not match VERSION $version"
          }
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Release preflight
        run: python -m tools.preflight --require-clean
      - name: Validate graph, prose, assets, and generated scripts
        run: python -m tools.validate
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: renpy-windows-8.5.3-ff57648f
      - name: Fetch and verify official SDK
        run: python -m tools.build.sdk
      - name: Ren'Py lint
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . lint --error-code --all-problems
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual Windows interaction tests
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . test global --report-detailed --overwrite-screenshots --savedir "$env:RUNNER_TEMP\renpy-source-saves" 2>&1 | Tee-Object -FilePath reports/source-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.build.verify_package --report reports/source-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows ZIP
        run: |
          python -m tools.build.package --sdk .\.runtime\renpy-8.5.3-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify extracted standalone EXE and write hashes
        run: |
          $zip = Get-ChildItem dist -Filter '*-win.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP missing' }
          python -m tools.build.verify_package --zip $zip.FullName --timeout 900
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          @{ commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; version = (Get-Content VERSION -Raw).Trim(); audio_driver = $env:SDL_AUDIODRIVER } | ConvertTo-Json | Set-Content reports/ci-context.json
      - name: Refuse to replace an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_EXPECTED_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; refusing to replace it automatically."
          }
          exit 0
      - name: Publish verified selected commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_EXPECTED_VERSION"
          $flags = @()
          if ($env:RELEASE_PRERELEASE -eq "true") { $flags += "--prerelease" }
          gh release create $tag dist/* --target "$env:GITHUB_SHA" @flags --title "雨停之前 $tag" --notes-file docs/RELEASE_NOTES.md
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/
            reports/screenshots/
            dist/SHA256SUMS.txt
            log.txt
            errors.txt
            traceback.txt
