name: Game validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test, build, and run Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      SDL_AUDIODRIVER: dummy
      RENPY_RENDERER: angle2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start-of-batch preflight
        run: python -m tools.preflight --require-clean
      - name: Validate graph, prose, assets, and generated scripts
        run: python -m tools.validate
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: renpy-windows-8.5.3-ff57648f
      - name: Fetch and verify official SDK
        run: python -m tools.build.sdk
      - name: Ren'Py lint
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . lint --error-code --all-problems
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual Windows interaction tests
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m tools.build.display
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.build.verify_package --source-sdk .\.runtime\renpy-8.5.3-sdk --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows ZIP
        run: |
          python -m tools.build.package --sdk .\.runtime\renpy-8.5.3-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and boot EXE extracted from distribution
        run: |
          $zip = Get-ChildItem dist -Filter '*-win.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP missing' }
          python -m tools.build.verify_package --zip $zip.FullName --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item reports/package/screenshots/native-main-menu.png "dist/BeforeTheRainStops-$version-preview.png"
          Get-ChildItem dist -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          @{ commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; version = (Get-Content VERSION -Raw).Trim(); audio_driver = $env:SDL_AUDIODRIVER } | ConvertTo-Json | Set-Content reports/ci-context.json
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/
            reports/screenshots/
            dist/SHA256SUMS.txt
            log.txt
            errors.txt
            traceback.txt
      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          if-no-files-found: error
          path: dist/
