name: Game validation and Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Test, build, and run Windows package
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
      RENPY_RENDERER: angle2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate graph, prose, assets, and generated scripts
        run: python -m tools.validate
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: renpy-windows-8.5.3-ff57648f
      - name: Fetch and verify official SDK
        run: python -m tools.build.sdk
      - name: Ren'Py lint
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . lint --error-code --all-problems
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run actual Windows interaction tests
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . test global --report-detailed --overwrite_screenshots --savedir "$env:RUNNER_TEMP\renpy-source-saves"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows ZIP
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py launcher distribute . --package windows --destination dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and boot EXE extracted from distribution
        run: |
          $zip = Get-ChildItem dist -Filter '*-win.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP missing' }
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP\package"
          $exe = Get-ChildItem "$env:RUNNER_TEMP\package" -Recurse -Filter 'BeforeTheRainStops.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Standalone EXE missing' }
          $gameDirectory = Join-Path $exe.Directory.FullName 'game'
          if (Test-Path (Join-Path $gameDirectory 'testcases.rpy')) { throw 'Tests leaked into release' }
          if (Test-Path (Join-Path $gameDirectory 'data')) { throw 'Authoring data leaked into release' }
          Copy-Item game/testcases.rpy (Join-Path $gameDirectory 'testcases.rpy')
          & $exe.FullName test global --report-detailed --overwrite_screenshots --savedir "$env:RUNNER_TEMP\renpy-package-saves"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/
            game/tests/screenshots/
            log.txt
            errors.txt
            traceback.txt
      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          if-no-files-found: error
          path: dist/
      - name: Publish verified tagged release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/* --target "$env:GITHUB_SHA" --prerelease --title "雨停之前 $tag" --notes-file docs/RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    permissions:
      contents: write
