name: Restore v0.7 story checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.v07-restore-trigger'

permissions:
  contents: write

concurrency:
  group: v07-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore story, regenerate, validate, and commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply restored v0.7 story batch
        run: python tools/restore_v07_story.py
      - name: Register reviewed v0.7 prompts
        run: python -m tools.prompt_registry --write
      - name: Regenerate Ren'Py story and interaction tests
        run: |
          python -m tools.compile_story
          python -m tools.compile_tests
      - name: Run complete authoring validation
        run: python -m tools.validate
      - name: Remove one-off restoration machinery
        shell: bash
        run: |
          rm tools/restore_v07_story.py
          rm .github/workflows/restore-v07.yml
          rm .v07-restore-trigger
      - name: Commit restored checkpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "story: restore v0.7 chapters through ch03 checkpoint"
          git push origin HEAD:main
