name: Publish exact approved v1.1.1 Windows package

on:
  push:
    branches: [main]
    paths:
      - 'docs/review/V111_PUBLICATION_AUTHORIZATION.json'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Authorized VERSION value
        required: true
        default: '1.1.1'
        type: string

concurrency:
  group: formal-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      EXPECTED_VERSION: ${{ inputs.expected_version || '1.1.1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind machine checks and user publication authorization to exact candidate
        id: accepted
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne $env:EXPECTED_VERSION) { throw 'VERSION mismatch' }
          python -m tools.release_gate --machine docs/evidence/v111-acceptance.json --human docs/review/V111_HUMAN_ACCEPTANCE.json --authorization docs/review/V111_PUBLICATION_AUTHORIZATION.json --version $env:EXPECTED_VERSION --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch approved successful CI artifact
        shell: pwsh
        env:
          ACCEPTED_RUN: ${{ steps.accepted.outputs.run_id }}
          ACCEPTED_ARTIFACT: ${{ steps.accepted.outputs.artifact_id }}
          ACCEPTED_COMMIT: ${{ steps.accepted.outputs.candidate }}
        run: |
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ACCEPTED_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($run.head_sha -ne $env:ACCEPTED_COMMIT -or $run.conclusion -ne 'success' -or $run.status -ne 'completed' -or $run.path -ne '.github/workflows/game.yml') { throw 'Accepted CI identity/status mismatch' }
          $listing = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:ACCEPTED_RUN/artifacts?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matches = @($listing.artifacts | Where-Object { $_.name -eq "windows-$env:ACCEPTED_COMMIT" })
          if ($matches.Count -ne 1 -or $matches[0].id -ne $env:ACCEPTED_ARTIFACT -or $matches[0].expired) { throw 'Accepted artifact missing, replaced or expired; restore/revalidate explicitly' }
          gh run download $env:ACCEPTED_RUN --repo $env:GITHUB_REPOSITORY --name "windows-$env:ACCEPTED_COMMIT" --dir accepted-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify reviewed ZIP and refuse existing tag or release
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.accepted.outputs.package }}
          PACKAGE_SHA: ${{ steps.accepted.outputs.sha256 }}
        run: |
          python -m tools.release_gate --machine docs/evidence/v111-acceptance.json --human docs/review/V111_HUMAN_ACCEPTANCE.json --authorization docs/review/V111_PUBLICATION_AUTHORIZATION.json --version $env:EXPECTED_VERSION --zip "accepted-package/$env:PACKAGE_NAME" --preview "accepted-package/BeforeTheRainStops-$env:EXPECTED_VERSION-preview.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$env:EXPECTED_VERSION"
          foreach ($endpoint in @("releases/tags/$tag", "git/ref/tags/$tag")) {
            $result = gh api "repos/$env:GITHUB_REPOSITORY/$endpoint" 2>&1
            if ($LASTEXITCODE -eq 0) { throw "Existing $endpoint; refusing replacement" }
            if (($result | Out-String) -notmatch 'HTTP 404') { throw "Could not verify absence of $endpoint" }
          }
          "$env:PACKAGE_SHA  $env:PACKAGE_NAME" | Set-Content accepted-package/SHA256SUMS.txt -Encoding utf8NoBOM
          # The expected gh 404 probes leave LASTEXITCODE=1; all checks above passed.
          exit 0
      - name: Verify shared production contract added after the game candidate
        shell: pwsh
        run: |
          node scripts/vn-contract.mjs game/data/story.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content docs/production/REUSE-MANIFEST.json -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files.PSObject.Properties) {
            $actual = (Get-FileHash -LiteralPath $file.Name -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $file.Value) { throw "Shared production file changed: $($file.Name)" }
          }
      - name: Verify publication commit contains the identical accepted game source
        shell: pwsh
        env:
          ACCEPTED_COMMIT: ${{ steps.accepted.outputs.candidate }}
        run: |
          git fetch --no-tags --depth=1 origin $env:ACCEPTED_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changes = @(git diff --name-only $env:ACCEPTED_COMMIT $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # These post-candidate support files do not enter the reviewed player ZIP.
          $pinnedSupportFiles = @{
            'AGENTS.md' = '7f667d701879491da6d3396777a012d85266bcf9'
            'scripts/vn-contract.mjs' = '42b74123d7e3118fde12be2501c98365b0927330'
            'scripts/vn-contract.d.mts' = '6620c50d14ad8df5a23b20cf81827fabf892061d'
            '.github/workflows/recover-v111-review.yml' = '9430b339c5dc173e0dd14ba2c8b1ef86251df62b'
          }
          foreach ($path in $pinnedSupportFiles.Keys) {
            $object = git rev-parse "$($env:GITHUB_SHA):$path"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($object.Trim() -ne $pinnedSupportFiles[$path]) { throw "Post-candidate support file differs: $path" }
          }
          $allowedMetadata = @('README.md', 'ROADMAP.md', 'CHANGELOG.md', '.github/workflows/release-v111.yml') + @($pinnedSupportFiles.Keys)
          $unexpected = @($changes | Where-Object { $_ -cnotmatch '^docs/' -and $_ -cnotin $allowedMetadata })
          if ($unexpected.Count -ne 0) { throw "Publication changed accepted game source: $($unexpected -join ', ')" }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/branches/main" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($main.commit.sha -ne $env:GITHUB_SHA) { throw 'Main advanced during publication; inspect and retry explicitly' }
          Write-Host "Identical accepted game source: $env:ACCEPTED_COMMIT; publication tag target: $env:GITHUB_SHA"
          $changes | ForEach-Object { Write-Host "Publication metadata: $_" }
      - name: Publish accepted bytes and read back download
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ steps.accepted.outputs.package }}
          ACCEPTED_COMMIT: ${{ steps.accepted.outputs.candidate }}
        run: |
          $tag = "v$env:EXPECTED_VERSION"
          gh release create $tag "accepted-package/$env:PACKAGE_NAME" "accepted-package/BeforeTheRainStops-$env:EXPECTED_VERSION-preview.png" accepted-package/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "雨停之前 $tag" --notes-file docs/RELEASE_NOTES_V111.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $env:PACKAGE_NAME --dir release-readback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.release_gate --machine docs/evidence/v111-acceptance.json --human docs/review/V111_HUMAN_ACCEPTANCE.json --authorization docs/review/V111_PUBLICATION_AUTHORIZATION.json --version $env:EXPECTED_VERSION --zip "release-readback/$env:PACKAGE_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
